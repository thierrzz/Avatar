name: Avatar
options:
  bundleIdPrefix: nl.avatar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.20"
  AvatarKit:
    path: AvatarKit
  AvatarUI:
    path: AvatarUI
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Audit HIGH #9: turn on Swift 6 strict-concurrency diagnostics in
    # "targeted" mode — flags Sendable + actor-isolation violations as
    # warnings without forcing a full Swift 6 language-mode migration.
    # `ImportFlow.swift` is the highest-risk surface; its existing pattern
    # (pass `ModelContainer`, re-derive `ModelContext` on `@MainActor`,
    # touch `AppState` only via `MainActor.run`) is already compatible.
    SWIFT_STRICT_CONCURRENCY: "targeted"
    MARKETING_VERSION: "1.2.1"
    CURRENT_PROJECT_VERSION: "18"
    DEVELOPMENT_TEAM: "5J92MMGKTX"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # CIColorKernel(source:) is "deprecated since macOS 10.14" but Apple still
    # ships it on macOS 26.4. Migrating the three matting kernels to Metal
    # Shading Language + a bundled .metallib is real work for zero functional
    # gain today. This define removes the deprecation attribute from the
    # CoreImage headers so the warnings stop drowning the build log.
    GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) CI_SILENCE_GL_DEPRECATION=1"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_STYLE: Manual
      PROVISIONING_PROFILE_SPECIFIER: ""

targets:
  Avatar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Avatar
        excludes:
          - "Info.plist"
          - "Info-MAS.plist"
          - "Avatar.entitlements"
          - "Avatar-MAS.entitlements"
    dependencies:
      - package: Sparkle
      - package: Supabase
      - package: ZIPFoundation
      - package: AvatarKit
    resources:
      - path: Avatar/Assets.xcassets
      - path: Avatar/Resources
    info:
      path: Avatar/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Aaavatar
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Aaavatar"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        # Privacy usage strings — audit CRITICAL #4. Aaavatar accesses
        # files exclusively through NSOpenPanel/NSSavePanel under the
        # `files.user-selected.read-write` sandbox entitlement, but macOS
        # 14+ surfaces TCC prompts for protected folders even on
        # user-selected paths. The strings below show as the prompt
        # rationale so the user sees a meaningful explanation rather than
        # a generic "wants to access your Desktop folder".
        NSDesktopFolderUsageDescription: "Aaavatar needs access to your Desktop to read portrait files you drag in and to save exports you choose to write there."
        NSDocumentsFolderUsageDescription: "Aaavatar needs access to Documents to read portrait files you import and to save exports and library archives you choose to write there."
        NSDownloadsFolderUsageDescription: "Aaavatar needs access to Downloads to read portrait files you import and to save exports you choose to write there."
        # Lock ATS down explicitly — defense-in-depth alongside the TLS
        # pinning in `TLSPinning.swift`. Defaults are already strict; this
        # makes the intent visible and forbids any future code path from
        # adding a hostname exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsForMedia: false
          NSAllowsArbitraryLoadsInWebContent: false
          NSAllowsLocalNetworking: false
        # Self-hosted Sparkle feed (audit HIGH #10). Old builds still
        # point at https://raw.githubusercontent.com/Square-One-Official/Avatar/main/appcast.xml,
        # which release.sh keeps in lockstep, so existing installs keep
        # updating during the transition window.
        SUFeedURL: "https://api.aaavatar.nl/appcast.xml"
        SUPublicEDKey: "iSKu+XIaNe3MhrEGij3zPVOqKvDuU+U1cz+NA2tJ4eU="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUAllowsAutomaticUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: nl.avatar.app.scheme
            CFBundleURLSchemes:
              - aaavatar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.avatar.app
        PRODUCT_NAME: Aaavatar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Avatar/Avatar.entitlements

  Avatar-MAS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Avatar
        excludes:
          - "Info.plist"
          - "Info-MAS.plist"
          - "Avatar.entitlements"
          - "Avatar-MAS.entitlements"
    dependencies:
      - package: Supabase
      - package: ZIPFoundation
      - package: AvatarKit
    resources:
      - path: Avatar/Assets.xcassets
      - path: Avatar/Resources
    info:
      path: Avatar/Info-MAS.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Aaavatar
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Aaavatar"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        # Privacy usage strings — match the Developer ID target (see above
        # for rationale).
        NSDesktopFolderUsageDescription: "Aaavatar needs access to your Desktop to read portrait files you drag in and to save exports you choose to write there."
        NSDocumentsFolderUsageDescription: "Aaavatar needs access to Documents to read portrait files you import and to save exports and library archives you choose to write there."
        NSDownloadsFolderUsageDescription: "Aaavatar needs access to Downloads to read portrait files you import and to save exports you choose to write there."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsForMedia: false
          NSAllowsArbitraryLoadsInWebContent: false
          NSAllowsLocalNetworking: false
        CFBundleURLTypes:
          - CFBundleURLName: nl.avatar.app.scheme
            CFBundleURLSchemes:
              - aaavatar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.avatar.app
        PRODUCT_NAME: Aaavatar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Avatar/Avatar-MAS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_STORE
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"

  Avatar2:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Avatar2
        excludes:
          - "Avatar2.entitlements"
    dependencies:
      - package: AvatarKit
      - package: AvatarUI
      - package: Sparkle
    resources:
      - path: Avatar2/Assets.xcassets
    info:
      path: Avatar2/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Aaavatar
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Aaavatar"
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.photography
        ITSAppUsesNonExemptEncryption: false
        # E13.1: EIGEN Sparkle-kanaal — v1-installs pollen appcast.xml en
        # zien 2.0-releases dus nooit; release-v2.sh voedt dit feed. Zelfde
        # EdDSA-publieke sleutel als v1: updates getekend met dezelfde
        # private key (release-infra). Bouwen vergt geen signing; publiceren wel.
        SUFeedURL: "https://api.aaavatar.nl/appcast-v2.xml"
        SUPublicEDKey: "iSKu+XIaNe3MhrEGij3zPVOqKvDuU+U1cz+NA2tJ4eU="
        # E13.7: macOS 15+ toont deze tekst wanneer de app voor het eerst de
        # Aaavatar 1-container leest (directe migratie, Settings → Migration).
        NSAppDataUsageDescription: "Aaavatar reads the library that Aaavatar 1 left on this Mac so it can import your portraits."
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
        # Geen SUEnableDownloaderService: Avatar2 heeft network.client, dus de
        # appcast/downloads lopen in-process. De Downloader-XPC is dan overbodig
        # én hangt onder Xcode (debugger spawnt 'm suspended, kan niet attachen
        # → check blijft eeuwig "Checking…"). v1 blijft ongewijzigd.
        SUAllowsAutomaticUpdates: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsForMedia: false
          NSAllowsArbitraryLoadsInWebContent: false
          NSAllowsLocalNetworking: false
        # Stripe-checkout keert terug via aaavatar://stripe-return|stripe-cancel
        # (hardcoded in backend/api/v1/checkout/*). Auth 2.0 gebruikt geen
        # deep-links meer; dit scheme blijft puur voor de Stripe-roundtrip.
        # Let op: v1 registreert hetzelfde scheme — met beide apps op één
        # machine kiest LaunchServices er één (acceptabel tijdens de transitie).
        CFBundleURLTypes:
          - CFBundleURLName: nl.squareone.aaavatar2.scheme
            CFBundleURLSchemes:
              - aaavatar
        # PoC (left-nav): eigen sleep-type voor het verplaatsen van een portret
        # naar een map (PortraitDragItem). Geëxporteerd zodat de interne drag
        # niet matcht op de venster-brede foto-import (.fileURL/.image).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: nl.squareone.aaavatar2.portrait-ref
            UTTypeDescription: Aaavatar portrait reference
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.squareone.aaavatar2
        # Productnaam = gewoon "Aaavatar" (besluit Thierry 2026-09-04): dezelfde
        # bestandsnaam als v1, dus een drag-install vervangt Aaavatar 1 in
        # /Applications. Bundle-id blijft nl.squareone.aaavatar2 (Keychain,
        # container, Sparkle-feed hangen eraan). "Aaavatar 2" is alleen nog de
        # naam van deze codebase-generatie. Let op: v1 heet óók Aaavatar.app —
        # build-v2.sh bouwt v1 daarom in een eigen DerivedData.
        PRODUCT_NAME: Aaavatar
        # Expliciete modulenaam: Avatar2Tests doet `@testable import Avatar2`;
        # zonder override zou de module "Aaavatar" heten.
        PRODUCT_MODULE_NAME: Avatar2
        # E13.1: eigen versielijn, los van de root-settings (die zijn van v1).
        # Zonder deze overrides erfde Aaavatar 2 v1's 1.2.1/18 en zou een
        # v1-release-bump het v2-kanaal stil hernummeren. Build start op 100:
        # ruim boven élk v1-buildnummer, zodat een dev-binary die ooit op het
        # gedeelde feed stond nooit een "downgrade" ziet.
        MARKETING_VERSION: "2.0.2"
        CURRENT_PROJECT_VERSION: "104"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Avatar2/Avatar2.entitlements
        OTHER_LDFLAGS: "$(inherited) -weak_framework ImagePlayground -weak_framework FoundationModels"
    scheme:
      testTargets:
        - Avatar2Tests

  # E01.9 — unit-tests voor app-target-logica (modellen in Avatar2/Features/).
  # Draait gehost in Aaavatar.app (het Avatar2-product); scripts/build-v2.sh neemt dit mee.
  Avatar2Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Avatar2Tests
    dependencies:
      - target: Avatar2
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aaavatar.app/Contents/MacOS/Aaavatar"
        BUNDLE_LOADER: "$(TEST_HOST)"
